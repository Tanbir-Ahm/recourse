# Recourse -- Streamlit theme + server config for the public deploy.

[theme]
base = "light"
primaryColor = "#1f6f78"          # teal accent -- buttons, focus, links
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#faf8f3"   # warm paper -- cards, sidebars, code
textColor = "#17242b"
font = "serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
# Largest upload the page accepts, in MB (Streamlit's own default is 200, and it holds the whole file in memory before the page's own 8 MB check can refuse it: recourse_upload._MAX_BYTES). 2026-11-07, FOLLOW_UPS 2dq.
maxUploadSize = 10
# Railway/Render inject $PORT; the start command passes it explicitly.

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "minimal"
